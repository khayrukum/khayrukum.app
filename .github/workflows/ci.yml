name: ci
on:
  pull_request:
  push:
    branches: [main, v1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Data validation (TST-10, TST-11)
        run: node tools/validate-data.mjs
      - name: Alignment check (TST-16)
        run: node tools/port/align.mjs --check
      - name: Content and code lint (TST-12)
        run: node tools/content-lint.mjs
      - name: Unit tests (TST-15)
        run: node --test tests/unit/*.test.mjs
      - name: Audio check (TST-35) — skipped while audio is not in the repository
        run: node tools/check-audio.mjs
      - name: Build with audio disabled (AUD-40, OFF-05, NFR-PERF-03)
        run: node tools/build.mjs
      - name: End-to-end (TST-14/20/22/23/31/32/36/40 subset)
        run: node --test --test-concurrency=1 tests/e2e/*.test.mjs
