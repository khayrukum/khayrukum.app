# Trial deployment: builds the v1 branch (non-strict, audio off) and publishes it to GitHub Pages
# so the owner can try it on a phone before the release. Lives on main because the github-pages
# environment only accepts deployments from the default branch.
name: preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/preview.yml', '.github/preview-trigger']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node tools/validate-data.mjs
      - run: node tools/check-audio.mjs
      - run: node tools/build.mjs --version "preview-${GITHUB_RUN_NUMBER}"
      - run: rm -f dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
